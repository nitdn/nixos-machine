# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

# shorturl schemes
# scheme rest expands rest into {path}
[shorturls]
gh = "github:{path}"
np = "https://channels.nixos.org/{path}/nixexprs.tar.zst"
codeberg = "git+https://codeberg.org/{path}.git"
codeberg-tarball = "https://codeberg.org/{path}/archive/main.tar.gz"

# all_follow maps input names to the top-level pin they follow
# opt out per-input with exclude_follow
[all_follow]
# Nixpkgs is completely cooked, defer to whatever lockfiles they have
nixpkgs = ["nixpkgs-stable", "nixpkgs-lib"]
# wrappers = "wrappers"
treefmt-nix = "treefmt-nix"
flake-parts = "flake-parts"

# auto-dedup (no top-level pin needed):
fenix = "fenix"
rust-analyzer-src = "rust-analyzer"
crane = "crane"
systems = "default"
flake-utils = ["utils"]
git-hooks = "git-hooks"

[omit_inputs]
names = ["flake-compat", "cachix", "home-manager"]

# inputs.<name> fields
#   url             required, shorturl ok, ?rev=<sha> pins an exact commit
#   type            flake (default), fetch, or fixed
#   flake           legacy false means type = "fetch"
#   follows         { child = "pin" } override map
#   exclude_follow  all_follow names to skip
#   dir             subdir holding flake.nix
#   submodules      fetch git submodules
#   unpack          fixed-only tarball or file

[inputs.affinity-nix]
url = "github:mrshmllow/affinity-nix"

[inputs.affinity-nix.follows]
flake-parts = "flake-parts"

[inputs.disko]
url = "github:nix-community/disko"

[inputs.flake-parts]
url = "github:hercules-ci/flake-parts"

[inputs.inshellah]
url = "github:manic-systems/inshellah/"
exclude_follow = ["nixpkgs"]

[inputs.microvm]
url = "github:microvm-nix/microvm.nix"

[inputs.nix-index-database]
url = "github:nix-community/nix-index-database"

[inputs.nixpkgs]
url = "np:nixos-26.05"

[inputs.nix-unstable]
url = "np:nixos-unstable"

[inputs.run0-sudo-shim]
url = "github:lordgrimmauld/run0-sudo-shim"

[inputs.sops-nix]
url = "github:Mic92/sops-nix"

[inputs.steam-presence]
url = "github:JustTemmie/steam-presence"

[inputs.treefmt-nix]
url = "github:numtide/treefmt-nix"

[inputs.wrappers]
url = "github:nix-community/nix-wrapper-modules"

[inputs.zen-browser]
url = "github:0xc000022070/zen-browser-flake"

[inputs.tack]
url = "gh:manic-systems/tack"

[inputs.bizhub-225i]
url = "https://dl.konicaminolta.eu/en/?tx_kmdownloadproxy_downloadproxy[fileId]=4562fe1cc1a8e069fd2f57714fd11d89&tx_kmdownloadproxy_downloadproxy[documentId]=138755&tx_kmdownloadproxy_downloadproxy[system]=KonicaMinolta&tx_kmdownloadproxy_downloadproxy[language]=EN&type=1558521685"
type = "fixed"
group = "drivers"
frozen = true

[inputs.cade]
url = "gh:manic-systems/cade/"

[inputs.nix-flatpak]
