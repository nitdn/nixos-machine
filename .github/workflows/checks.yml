name: "All nixos-machines checks"
on:
  push:
jobs:
  check_flake:
    name: "Run flake checks"
    runs-on: ubuntu-latest
    environment: cachix
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: cache.curlew-rankine.ts.net

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: >
            keep-env-derivations = true

            keep-outputs = true

            substituters =
            https://machines.cachix.org/
            https://nix-community.cachix.org/
            https://cache.manic.systems/
            https://cache.forall.systems/
            https://cache.nixos.org/
            https://cache.curlew-rankine.ts.net/

            system-features = nixos-test benchmark big-parallel kvm

            trusted-public-keys =
            cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            machines.cachix.org-1:imnXlKFUc4Iaedv6469v6TO37ruiNh6OfJN4le5bqdE=
            nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            cache.manic.systems-1:s6OZanN8Us8vRi0jVivP3qlMn0cYHBjBALKrNe5nH8s=
            cache.forall.systems:5PmD7QO4MSF8YgyRZtkSGXRDo96H3bybIf2SsQh8ScI=
            cache.curlew-rankine.ts.net-1:GFW+bWipZGYv99VtugN7KhX7QTOm9qAnxaZYWan+5dk=

            experimental-features = pipe-operators nix-command flakes
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: machines
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Check flakes
        run: |
          nix flake check --keep-going  \
          --no-allow-import-from-derivation
  build_hosts:
    name: "Build packages for hosts"
    runs-on: ubuntu-latest
    environment: cachix
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
      - name: Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: cache.curlew-rankine.ts.net
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: >
            keep-env-derivations = true

            keep-outputs = true

            substituters =
            https://machines.cachix.org/
            https://nix-community.cachix.org/
            https://cache.manic.systems/
            https://cache.forall.systems/
            https://cache.nixos.org/
            https://cache.curlew-rankine.ts.net/

            system-features = nixos-test benchmark big-parallel kvm

            trusted-public-keys =
            cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            machines.cachix.org-1:imnXlKFUc4Iaedv6469v6TO37ruiNh6OfJN4le5bqdE=
            nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            cache.manic.systems-1:s6OZanN8Us8vRi0jVivP3qlMn0cYHBjBALKrNe5nH8s=
            cache.forall.systems:5PmD7QO4MSF8YgyRZtkSGXRDo96H3bybIf2SsQh8ScI=
            cache.curlew-rankine.ts.net-1:GFW+bWipZGYv99VtugN7KhX7QTOm9qAnxaZYWan+5dk=

            experimental-features = pipe-operators nix-command flakes
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: machines
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build machines
        env:
          MACHINES: "tjmaxxer,msi-colgate,disko-elysium"
        run: |
          nix copy --to ssh-ng://gh-runner@disko-elysium \
          .#nixosConfigurations.{${{ env.MACHINES }}}.\
          config.system.build.toplevel --no-check-sigs
