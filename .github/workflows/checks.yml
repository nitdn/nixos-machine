name: "All nixos-machines checks"

on:
  push:
  workflow_dispatch:

# Least privilege by default; jobs that need OIDC for Tailscale opt in below.
permissions:
  contents: read

# A newer push to the same ref supersedes the older run, so pushes don't pile up
# duplicate runs. Runs on the default branch are never cancelled midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  # Required: this is the job that decides whether the workflow passes.
  check_flake:
    name: "Run flake checks"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: cachix
    permissions:
      contents: read
      id-token: write # OIDC token for the Tailscale GitHub Action
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository] actionlint does not support `$/` yet
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_AUDIENCE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check flakes
        run: |
          nix flake check --keep-going \
            --no-allow-import-from-derivation

  # Optional: builds every host and pushes the results to the binary cache. A
  # failure here is shown on the job but does not fail the workflow run. It runs
  # in parallel with check_flake.
  build_hosts:
    name: "Build hosts and push to cache"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: true
    environment: cachix
    permissions:
      contents: read
      id-token: write # OIDC token for the Tailscale GitHub Action
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
      - name: Set up Nix
        uses: ./.github/actions/setup-nix # zizmor: ignore[self-repository] actionlint does not support `$/` yet
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_AUDIENCE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Ping binary cache
        continue-on-error: true
        run: |
          tailscale ping --peerapi disko-elysium
      - name: Set up cache push
        id: celler-watch
        env:
          # celler reads the token from this variable, so it stays out of the script text and command line.
          CELLER_TOKEN: ${{ secrets.CACHE_PUSH_TOKEN }}
        run: |
          nix profile add \
            github:Mic92/nix-fast-build#nix-fast-build
          nix-fast-build \
            --flake "github:celler-cache/celler#packages.x86_64-linux.celler" --out-link result #\
            # --option substituters "https://cache.nixos.org https://nix-community.cachix.org"
          nix profile add \
            github:celler-cache/celler#celler
          celler login elysium https://cache.curlew-rankine.ts.net

      - name: Build machines
        run: |
          # One evaluation for every host in the flake: --flake takes a single path,
          # so point it at nixosConfigurations and let --select turn each
          # configuration into its toplevel derivation before nix-eval-jobs
          # traverses them.
          nix-fast-build \
            --flake ".#nixosConfigurations" \
            --select "cfgs: builtins.mapAttrs (_: c: c.config.system.build.toplevel) cfgs" \
            --skip-cached \
            --celler-cache elysium:cache-1 \
            --push-build-closure \
            --option extra-experimental-features pipe-operators
