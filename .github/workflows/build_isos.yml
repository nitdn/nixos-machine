name: "Build installer ISO images"
on:
  release:
    types: [created]

# No permissions by default; the job below opts in to what it needs.
permissions: {}

# One run per release tag. Never cancel midway, so a release upload can't be cut off.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: "Build a minimal image"
    runs-on: ubuntu-latest
    permissions:
      contents: write # Upload the built ISO to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: |
          nix build .#isoBootstrap
      - name: Upload the ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" result/iso/*
